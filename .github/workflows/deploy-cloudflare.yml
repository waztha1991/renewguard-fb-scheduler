name: Deploy FB Scheduler to Cloudflare (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Secrets pushed to the Worker itself (not build-time) — see README for setup.
        run: |
          npx wrangler deploy
          npx wrangler secret put FB_APP_ID <<< "${{ secrets.FB_APP_ID }}"
          npx wrangler secret put FB_APP_SECRET <<< "${{ secrets.FB_APP_SECRET }}"
          npx wrangler secret put LINKEDIN_CLIENT_ID <<< "${{ secrets.LINKEDIN_CLIENT_ID }}"
          npx wrangler secret put LINKEDIN_CLIENT_SECRET <<< "${{ secrets.LINKEDIN_CLIENT_SECRET }}"
          npx wrangler secret put ADMIN_USER <<< "${{ secrets.SCHEDULER_ADMIN_USER }}"
          npx wrangler secret put ADMIN_PASSWORD <<< "${{ secrets.SCHEDULER_ADMIN_PASSWORD }}"
